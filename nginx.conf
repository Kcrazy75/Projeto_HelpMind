events {}

http {
    upstream backend {
        server backend_node1:8000 max_fails=1 fail_timeout=5s;
        server backend_node2:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}